<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Human Resource and Team Development</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="/web/table.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />   
    <script type="module" src="/web/scripts.js"></script>
    <script type="module" src="/web/table.js"></script>
</head>

<!-- -------------------------------- navbar -------------------------------- -->
<body>  
    <nav>
        <div class="arrow-back-btn">
            <a href="/web/a_school_perf.html">
                <i class="fa-solid fa-angle-left left"></i>
            </a>
            <h1>School Performance</h1>
        </div>
    </nav>

<!-- --------------------------------main content-------------------------------- -->
    <div class="table-page">
        <div class="page-header">
            <div>
                <h1>Human Resource and Team Development</h1>
                <p>School Performance Documents</p>
            </div>
            <button id="uploadBtn" class="upload-btn staff-only">
                Upload File
            </button>
        </div>
        <div class="toolbar">
            <input
                type="text"
                id="searchInput"
                placeholder="Search files...">
        </div>
        <div class="table-container">
            <table class="files-table">
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Uploaded By</th>
                        <th>Date Uploaded</th>
                        <th>Size</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                    <!-- JavaScript will insert files here -->
                    <tr>
                        <td colspan="5" class="empty">
                            No files uploaded.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
<!-- -------------------------------- Hidden Upload Window -------------------------------- -->
    <div id="uploadModal" class="upload-modal">
        <div class="upload-box">
            <span class="close-upload">&times;</span>
            <h2>Upload Human Resource and Team Development File</h2>
            <input
                type="file"
                id="fileInput"
            >
            <button id="uploadFileButton">
                Upload
            </button>
        </div>
    </div>
    
<!-- --------------------------------footer-------------------------------- -->
    <footer class="site-footer">
        <section class="footer-bottom">
            <div class="socials">
                <a href="https://www.facebook.com/DepEdACES109582" class="fa-brands fa-facebook-f"></a>
                <a href="#" class="fa-solid fa-at"></a>
                <a href="#" class="fa-solid fa-phone"></a>
            </div>
            <div class="footerbottom">
                <p>&copy; <span id="current-year"></span> ACES. All rights reserved.</p>
            </div>
        </section>
    </footer> 
</body>
</html>
