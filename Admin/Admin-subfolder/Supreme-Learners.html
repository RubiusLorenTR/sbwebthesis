<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../admin-nav.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <title>Admin-School Profile</title>
        <body>
            
            <!------ NAVIGATION FOR SCHOOL PROFILE ------>
            <nav>
                <div class="nav-school-profile">
                     <a href="../admin-schoolprofile.html">
                      <i class="fa-solid fa-angle-left left"></i>
                     </a>
                     <h1>Supreme Learners E-gov</h1>
                </div>
            </nav>

    
            <section class="button-area">
                 <div class="buttons">
                <button class="upload" onclick="openpopupModal()">Upload Docs<i class="fa-solid fa-upload"></i></button>
                <button class="scan" onclick="openscanModal()">Scan Docs<i class="fa-solid fa-expand"></i></button>
                <button>Edit<i class="fa-regular fa-pen-to-square"></i></button>
            </div>
            </section>


                    <!------ for pop up upload ------>

    <div class="popup-modal" id="popupModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closepopupModal()">&times;</span>

            <h2>Upload Files</h2>
            <p>Upload files you want to add to the system. PDF, DOC, or Images</p>

            <div class="drag-section">
            <div class="upload-area">
                <div class="upload-icon">
                    <i class="fa-solid fa-cloud-arrow-up" alt="upload"></i>
                </div>
               <span>Drag & Drop files here</span>
               <span>or</span>
            <button class="upload-btn" id="submitbtn">browse files</button>
            <input type="file" class="fileInput" multiple>
        </div>
        <div class="upload-area">
            Drop Files Here
        </div>
    </div>
    </div>
    </div>

    <!------ for pop up scan ------>
    
    <div class="scan-modal" id="scanModal">
        <div class="scan-box">
            <span class="scan-close-btn" onclick="closescanModal()">&times;</span>

            <h2>Scan Files</h2>
            <p>Scan files you want to add to the system. PDF, DOC, or Images</p>

            <div class="scan-section">
            <div class="scan-area">
                <div class="scan-icon">
                    <i class="fa-solid fa-expand" alt="scan"></i>
                </div>
                 <span>Scan to generate documents</span>
            <button class="scan-btn" id="scanbtn">Open Camera</button>
        </div>
    </div>
    </div>
    </div>


     <script src="../../scripts.js"></script>
        </body>
</html>
